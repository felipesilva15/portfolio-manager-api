version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/docker/entrypoint.sh"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_PORT: 3306
