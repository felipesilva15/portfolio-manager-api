name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-latest-arm64
            platform: linux/arm64
            suffix: arm64
            
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image name
        id: image_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print tolower($2)}')
          echo "name=${{ secrets.DOCKER_USERNAME }}/$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Build and push single platform
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image_name.outputs.name }}:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  create-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image name
        id: image_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print tolower($2)}')
          echo "name=${{ secrets.DOCKER_USERNAME }}/$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Create and push manifest
        run: |
          IMAGE=${{ steps.image_name.outputs.name }}
          docker manifest create $IMAGE:latest $IMAGE:latest-amd64 $IMAGE:latest-arm64
          docker manifest push $IMAGE:latest
